[package]
name = "sieve"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { version = "=1.0.105", default-features = false, features = ["std"] }
# The integration API. HTTP/1.1 only (Sonder is the one client, on a private network).
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
hickory-proto = { version = "=0.26.4", default-features = false, features = ["std"] }
# The `Body` trait, to stream a query result out as it is written (already in the tree
# through hyper).
http-body = { version = "=1.1.0", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# TLS: reqwest's `rustls-no-provider` leaves the crypto provider to us. We compile only
# rustls' `ring` provider (no aws-lc-sys C build) and trust the bundled Mozilla roots,
# because the final image is `scratch` with no system certificate store.
# `http2` is needed: Quad9 answers HTTP/1.1 DoH with 505.
reqwest = { version = "=0.13.2", default-features = false, features = ["rustls-no-provider", "http2"] }
# SQLite compiled in (no system library in a scratch image). No `cache` feature: the writer
# prepares its statements once per batch instead, which avoids the hashlink dependency.
# `hooks` (authorizer, progress handler) and `limits` fence the dashboards' read-only SQL.
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "hooks", "limits"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
webpki-root-certs = { version = "=1.0.12", default-features = false }
toml = { version = "=1.2.2", default-features = false, features = ["parse", "serde"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["test-util"] }
# `ServiceExt::oneshot` drives the API router in tests without a socket.
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
