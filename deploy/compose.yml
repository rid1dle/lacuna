# lacuna: the house's ad-blocking DNS server. One container, no database server
# (SQLite is inside the binary), plus a tiny sidecar that copies the host's neighbour
# table for device names. Target: under 40 MB of RAM.
#
# LIVE since 2026-11-25: the host publishes :53 and AdGuard is stopped.
# For a shadow run beside another resolver, change the two port lines to 5300
# (README, "Run (shadow mode)").
#
# First time:
#   1. ~/homelab/scripts/provision/networks.sh   (creates the lacuna-api network)
# Then: docker compose up -d --build

# The project name must be set. Compose otherwise names the project after the
# folder, and Sonder's compose file also lives in a folder called deploy/, so
# both became project "deploy": `docker compose stop` here would stop Sonder too.
name: lacuna

services:
  lacuna:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: homelab/lacuna:latest
    container_name: lacuna
    environment:
      - TZ=Asia/Kolkata
      # SQLite's temp files (big sorts spill to disk). The root filesystem is
      # read-only, so they go to the data volume; `serve` creates the folder.
      - SQLITE_TMPDIR=/data/tmp
    volumes:
      - ./config.toml:/config/config.toml:ro
      - /srv/appdata/lacuna:/data
      - neigh:/neigh:ro
    secrets:
      - lacuna_api
    # Host 5300 (shadow) or 53 (live) onto 5353 inside: no capability is needed to
    # bind a high port in the container. Both IPv4 and IPv6 arrive through a kernel
    # rule (DNAT) that keeps the sender, because the default network has IPv6 on.
    ports:
      - "53:5353/udp"
      - "53:5353/tcp"
    # default: upstream DNS and list downloads. lacuna-api: internal, shared with
    # Sonder only, carries the dashboards' API on 8053.
    networks: [default, lacuna-api]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    # No cpus limit: a spent CFS quota pauses every thread, DNS answers included.
    restart: unless-stopped
    # No daemon.json on this host sets rotation, so the default would grow without end.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Asks itself for a name that only the rewrite table answers, so it proves the
    # listener, the rules and the pipeline, not the internet.
    healthcheck:
      test: ["CMD", "/lacuna", "ask", "home.riddlelab.dev", "A", "--server", "127.0.0.1:5353", "--expect", "192.168.0.107"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # lacuna's network cannot see the host's neighbour table, which links a device's
  # IPv6 addresses to its IPv4 one. This reads it on the host network (unprivileged:
  # reading needs no capability) and leaves a copy for lacuna every 30 s.
  neigh:
    image: alpine:3.24
    container_name: lacuna-neigh
    network_mode: host
    user: "3070:3070"
    volumes:
      - neigh:/neigh
    command:
      - sh
      - -c
      - while :; do ip neigh show > /neigh/.next && mv /neigh/.next /neigh/neigh; sleep 30; done
    # sh as PID 1 ignores SIGTERM; init makes a stop immediate.
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 16m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

secrets:
  lacuna_api:
    file: ./secrets/lacuna_api

volumes:
  # In memory: a copy of a table the kernel already holds, rewritten every 30 s.
  neigh:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=3070,gid=3070,mode=0750"

networks:
  # IPv6 on, so IPv6 lookups to the host's port 53 go through the kernel's DNAT rule and
  # keep their sender; without it docker-proxy relays them and lacuna logs the gateway.
  # Both subnets are pinned: config.toml names their gateways "homelab (docker)".
  # The IPv4 one is the subnet Docker picked when the network was first made.
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 192.168.224.0/20
          gateway: 192.168.224.1
        - subnet: fd0c:4c7d:8a53::/64
          gateway: fd0c:4c7d:8a53::1
  # internal: no route off the host. Only lacuna and Sonder.
  lacuna-api:
    external: true
