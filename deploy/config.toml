# Parity with the AdGuard Home setup it replaces.

user_rules = []

[dns]
listen = "0.0.0.0:5353"
refused_names = ["version.bind", "id.server", "hostname.bind"]
# Seconds a device keeps a block. At 10, apps that retry a blocked name every
# half minute (WhatsApp, Grammarly, Slack telemetry) asked again each time:
# 3,234 lookups a day for one name from one laptop. An unblock now reaches
# devices within the hour.
blocked_ttl = 3600
max_inflight = 300
router = "192.168.0.1"

[upstreams]
fallback = ["9.9.9.9:53", "1.1.1.1:53"]
race_timeout_ms = 1000

[[upstreams.doh]]
url = "https://dns10.quad9.net/dns-query"
bootstrap = ["9.9.9.10", "149.112.112.10"]

[[upstreams.doh]]
url = "https://cloudflare-dns.com/dns-query"
bootstrap = ["1.1.1.1", "1.0.0.1"]

[[lists]]
id = 1
name = "AdGuard DNS filter"
url = "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt"
enabled = true

[[lists]]
id = 2
name = "AdAway Default Blocklist"
url = "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt"
enabled = false

[[rewrites]]
name = "home.riddlelab.dev"
a = "192.168.0.107"

[[rewrites]]
name = "*.home.riddlelab.dev"
a = "192.168.0.107"

[devices]
# This server, seen three ways: Docker network gateways carry the containers'
# lookups, and lacuna's own health check asks from inside its container.
"192.168.224.1" = "homelab (docker)"
"172.20.0.1" = "homelab (docker)"
"127.0.0.1" = "lacuna healthcheck"
# Guessed from what they look up (2026-11-26); rename when known.
"192.168.0.117" = "iPhone 3"
"192.168.0.145" = "Echo"
"192.168.0.171" = "Mac 3"
"192.168.0.180" = "Amazon laptop 2"

[api]
listen = "0.0.0.0:8053"
secret_file = "/run/secrets/lacuna_api"
query_timeout_ms = 5000
row_cap = 10000
max_concurrent = 2

[store]
path = "/data/lacuna.db"
raw_days = 30
rollup_days = 365
lists_dir = "/data/lists"
